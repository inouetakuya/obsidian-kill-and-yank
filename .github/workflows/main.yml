name: CI
on:
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # We need to fetch with a depth of 2 for pull_request so we can do HEAD^2
          fetch-depth: 2

      # pnpm/setup は pnpm と Node の用意から pnpm install までを行うため、actions/setup-node は不要です
      # pnpm のバージョンは package.json の packageManager フィールドから解決されます
      - name: Setup
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@24
          cache: true

      # install や build は peer dependency の不整合を検出しないため、個別に確認します
      - name: Check peer dependencies
        run: pnpm peers check

      - name: Check format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # コミットメッセージは複数行になりうるため、デリミタで囲む形式で渡します
      - name: '[Pull Request] Get commit message'
        id: pr_get_commit_message
        run: |
          {
            echo 'pr_commit_message<<EOF'
            git log --format=%B -n 1 HEAD^2
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
        env:
          SLACK_MESSAGE: ${{ steps.pr_get_commit_message.outputs.pr_commit_message }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
